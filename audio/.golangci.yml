# golangci-lint v2 configuration.
#
# Run it through the tools module so its dependency tree stays out of the library's go.mod:
#
#	go tool -modfile=tools/go.mod golangci-lint run ./...
#	go tool -modfile=tools/go.mod golangci-lint fmt ./...
version: "2"

run:
  timeout: 10m
  tests: true
  build-tags:
    - integration

linters:
  # please, do not use `default: all`: inverted configuration does not scale across golangci-lint updates.
  default: none
  enable:
    - asciicheck
    - bodyclose
    - cyclop
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - makezero
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - promlinter
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
    - wsl_v5

  # don't enable:
  # - tagliatelle # have a different naming schema
  # - testpackage # this is not best practice in go
  # - godox # we want to use keywords like TODO or FIX in the code

  settings:
    cyclop:
      # the maximal code complexity to report
      max-complexity: 20
      # the maximal average package complexity. If it's higher than 0.0 (float) the check is enabled
      package-average: 0.0
    depguard:
      rules:
        all:
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: logging is done using the log/slog package
            - pkg: go.uber.org/zap
              desc: logging is done using the log/slog package
    dogsled:
      # checks assignments with too many blank identifiers
      max-blank-identifiers: 2
    dupl:
      threshold: 150
    errcheck:
      # report about not checking of errors in type assertions: `a := b.(MyStruct)`
      check-type-assertions: true
      # report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`
      check-blank: true
    exhaustive:
      # Presence of "default" case in switch statements satisfies exhaustiveness,
      # even if all enum members are not listed.
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 30
    goconst:
      min-len: 3
      min-occurrences: 2
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - octalLiteral
        - unnamedResult
      settings:
        hugeParam:
          # Size in bytes that makes the warning trigger.
          sizeThreshold: 80
    gocyclo:
      min-complexity: 30
    gomoddirectives:
      # List of allowed `replace` directives; this rule is so you don't accidentally commit replacements added for testing
      replace-allow-list: []
    govet:
      enable-all: true
      disable:
        - fieldalignment
    lll:
      line-length: 140
      tab-width: 1
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
        - operation
        - assign
    nakedret:
      # make an issue if func has more lines of code than this setting and it has naked returns
      max-func-lines: 5
    nlreturn:
      # Size of the block (including return statement that is still "OK") so no return split required.
      block-size: 5
    nolintlint:
      allow-unused: false # report any unused nolint directives
      require-explanation: true # require an explanation for nolint directives
      require-specific: true # require nolint directives to be specific about which linter is being skipped
    prealloc:
      # Report preallocation suggestions only on simple loops that have no returns/breaks/continues/gotos in them.
      simple: true
      range-loops: true
      for-loops: true
    revive:
      rules:
        - name: context-keys-type
        - name: time-naming
        - name: var-declaration
        - name: unexported-return
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
    staticcheck:
      initialisms: ["ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "ID", "IP", "JSON",
        "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI",
        "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS", "SIP", "RTP", "AMQP", "DB", "TS"]
    unparam:
      # Inspect exported functions. Set to true if no external program/library imports your code.
      check-exported: false
    whitespace:
      multi-if: false # Enforces newlines (or comments) after every multi-line if statement
      multi-func: false # Enforces newlines (or comments) after every multi-line function signature

  exclusions:
    generated: lax
    # Same effective behaviour as the v1 defaults. Note that the "comments" preset hides revive's `exported` and
    # `package-comments` findings (about 156 issues); dropping it enforces doc comments (pending decision, CLAUDE.md §7).
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - _review
      - tmp
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gochecknoglobals
          - noctx
          - funlen
          - err113
          - mnd
          - forcetypeassert
          - dogsled
          - goconst
          - unparam
          - dupl
      - linters:
          - govet
        text: 'declaration of "err" shadows declaration'
      # sample and bit codecs: bit widths and byte layouts are the specification, and byte truncation of in-range
      # samples is intentional
      - path: encoding/(pcm|lpc|wav/data/conv)/
        linters:
          - mnd
      - path: encoding/(pcm|wav/data/conv)/
        linters:
          - gosec
        text: G115
      # test helpers encode RIFF/WAVE layouts and test-signal constants; magic numbers are the point there
      - path: internal/(testutil|fixtures)/
        linters:
          - mnd
          - gosec
          - gocognit
      - path: internal/(testutil|fixtures)/
        linters:
          - gocritic
        text: "hugeParam|rangeValCopy"

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/zalgonoise/x/audio)
  exclusions:
    generated: lax
    paths:
      - _review
      - tmp

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
