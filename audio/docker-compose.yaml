version: '3.7'
services:

  audio:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    # flags fall back to AUDIO_* variables (cmd/audio -h); the input (AUDIO_INPUT) comes from .env. The command
    # reconnects to a live stream by itself; the restart policy covers crashes.
    environment:
      - AUDIO_METRICS=prometheus
      - AUDIO_METRICS_SPECTRUM=third-octave # the Grafana spectrum panels; octave, full or none also work
      - AUDIO_RECONNECT=true
      - AUDIO_PROMETHEUS_ADDR=:13088
      - AUDIO_LOG_FORMAT=json
    env_file:
      - "./.env"
    volumes:
      - "./local:/local"
    ports:
      - "13088:13088"
    networks:
      audionet:
  

networks:
  audionet: