version: "2"

run:
  timeout: 10m
  issues-exit-code: 1
  tests: true
  # Lint the testcontainers-based tests of the SQL repositories too.
  build-tags:
    - integration

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - cyclop
    - dogsled
    - err113
    - errorlint
    - exhaustive
    - funlen
    - gochecknoglobals
    - goconst
    - gocritic
    - goprintffuncname
    - gosec
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - promlinter
    - revive
    - unconvert
    - unparam
    - wsl_v5

  settings:
    funlen:
      lines: 100
      statements: 50
    cyclop:
      max-complexity: 15
      package-average: 0.0

  exclusions:
    rules:
      # Example programs spell out their sample data.
      - path: examples/
        linters:
          - mnd
      # The conformance suite in gachatest is test code shipped as a library.
      - path: (_test\.go|gachatest/)
        linters:
          - cyclop
          - err113
          - funlen
          - gochecknoglobals
          - goconst
          - gosec
          - mnd
          - noctx
          - wsl_v5
